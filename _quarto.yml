project:
  type: website
  output-dir: _site

website:
  title: "Advanced Databases for Precision Livestock Research"
  site-url: "https://amantaya.github.io/CowsCode26-Advanced-Databases/"
  navbar:
    right:
      - text: "Slides"
        href: index.qmd

format:
  revealjs:
    theme: [default]
    slide-number: c/t
    hash: true
    history: false
    controls: true
    progress: true
    chalkboard: false
    transition: fade
    background-transition: fade
    link-external-newwindow: true
    footer: "Advanced Databases Workshop"

execute:
  echo: false
